<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PURR 実験：黒い短毛の質感</title>
    <style>
      /* =====================================================
         実験ページ：黒い短毛の質感を3つの方法で比べる
         本番のスタイル（css/style.css）とは切り離している
         ===================================================== */

      :root {
        --bg: #f6efe6;
        --text: #4a3a30;

        /* 黒い毛の基本色（上ほど明るく、下ほど暗い） */
        --fur-top: #2b2b2e;
        --fur-mid: #161617;
        --fur-bottom: #080808;
        /* 上側のツヤ（わずかに青みのある灰色） */
        --fur-sheen: rgba(150, 155, 165, 0.42);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        line-height: 1.6;
        color: var(--text);
        background-color: var(--bg);
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
        padding: 1.5rem 1rem 3rem;
      }

      h1 {
        margin: 0;
        font-size: 1.25rem;
      }

      section {
        width: 100%;
        max-width: 480px;
      }

      h2 {
        margin: 0;
        font-size: 1rem;
      }

      section p {
        margin: 0 0 0.75rem;
        font-size: 0.875rem;
      }

      .motion-toggle {
        padding: 0.4rem 1rem;
        font: inherit;
        font-size: 0.875rem;
        color: var(--text);
        background: transparent;
        border: 1px solid currentColor;
        border-radius: 999px;
        cursor: pointer;
      }

      .motion-toggle:focus-visible {
        outline: 3px solid #c08a5a;
        outline-offset: 2px;
      }

      /* =====================================================
         共通：見本の枠と伸び縮み
         枠は 400×180、その中に 360×140 の楕円を置く
         （上下左右 20 の余白は、毛先がはみ出すためのもの）
         ===================================================== */
      .specimen {
        position: relative;
        width: 100%;
        aspect-ratio: 400 / 180;
        transform-origin: 50% 88.9%; /* 楕円の下端 */
        animation: fur-breathe 4s ease-in-out infinite;
      }

      @keyframes fur-breathe {
        0%,
        100% {
          transform: scaleY(1);
        }
        50% {
          transform: scaleY(1.03);
        }
      }

      /* 動きの切り替え（JS が data-motion を付ける） */
      :root[data-motion="off"] .specimen {
        animation-play-state: paused;
      }

      @media (prefers-reduced-motion: reduce) {
        :root:not([data-motion="on"]) .specimen {
          animation-play-state: paused;
        }
      }

      /* 楕円本体の位置（方法1・3で共通） */
      .fur-css::after,
      .fur-mix::after {
        content: "";
        position: absolute;
        inset: 11.1% 5%;
      }

      /* =====================================================
         方法1：CSS のグラデーションとぼかしだけ
         ===================================================== */

      /* 後ろの、ぼかした影（縁のふわっとした感じ） */
      .fur-css::before {
        content: "";
        position: absolute;
        inset: 12% 6%;
        border-radius: 50%;
        background: var(--fur-mid);
        filter: blur(4px);
        opacity: 0.5;
        box-shadow: 0 0 6px 1px rgba(10, 10, 10, 0.2);
      }

      .fur-css::after {
        background:
          /* 毛の筋：ほぼ横向きの細い縞を、角度を変えて重ねる */
          repeating-linear-gradient(176deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 3px),
          repeating-linear-gradient(4deg, rgba(0, 0, 0, 0.3) 0 1px, transparent 1px 4px),
          repeating-linear-gradient(181deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 5px),
          /* 上側のツヤ */
          radial-gradient(ellipse 55% 28% at 50% 22%, var(--fur-sheen), transparent 70%),
          /* 下側の影 */
          radial-gradient(ellipse 80% 50% at 50% 115%, rgba(0, 0, 0, 0.7), transparent 70%),
          /* 地色 */
          linear-gradient(to bottom, var(--fur-top), var(--fur-mid) 45%, var(--fur-bottom));
        /* 外周を少しずつ透明にして、輪郭線のない柔らかい縁にする */
        -webkit-mask-image: radial-gradient(closest-side, #000 91%, transparent 100%);
        mask-image: radial-gradient(closest-side, #000 91%, transparent 100%);
      }

      /* =====================================================
         方法2：SVG フィルター（下の <svg> の中で定義）
         ===================================================== */
      .fur-svg svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* =====================================================
         方法3：組み合わせ
         光の当たり方は CSS、毛の質感（縁・筋）は SVG フィルター
         ===================================================== */
      .fur-mix {
        filter: url(#fur-mix-filter);
      }

      .fur-mix::after {
        background:
          radial-gradient(ellipse 55% 28% at 50% 22%, var(--fur-sheen), transparent 70%),
          radial-gradient(ellipse 80% 50% at 50% 115%, rgba(0, 0, 0, 0.7), transparent 70%),
          linear-gradient(to bottom, var(--fur-top), var(--fur-mid) 45%, var(--fur-bottom));
        -webkit-mask-image: radial-gradient(closest-side, #000 90%, transparent 100%);
        mask-image: radial-gradient(closest-side, #000 90%, transparent 100%);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>実験：黒い短毛の質感</h1>

      <button type="button" class="motion-toggle" aria-pressed="false">動きを止める</button>

      <section>
        <h2>1. CSS だけ</h2>
        <p>グラデーション（地色・ツヤ・影・細い縞）＋ぼかした影＋マスクで縁を柔らかく。</p>
        <div class="specimen fur-css" role="img" aria-label="CSS だけで描いた黒い毛の楕円"></div>
      </section>

      <section>
        <h2>2. SVG フィルター</h2>
        <p>feTurbulence で横に流れる筋、feDisplacementMap で毛先の縁、feSpecularLighting で上からのツヤ。</p>
        <div class="specimen fur-svg">
          <svg viewBox="0 0 400 180" role="img" aria-label="SVG フィルターで描いた黒い毛の楕円">
            <defs>
              <linearGradient id="fur-svg-fill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#2b2b2e" />
                <stop offset="0.45" stop-color="#161617" />
                <stop offset="1" stop-color="#080808" />
              </linearGradient>
              <!-- 上側のツヤ（方法1と同じ位置・大きさ） -->
              <radialGradient id="fur-svg-sheen" cx="0.5" cy="0.22" r="0.5"
                              gradientTransform="translate(0.5 0.22) scale(1.1 0.56) translate(-0.5 -0.22)">
                <stop offset="0" stop-color="rgb(150, 155, 165)" stop-opacity="0.42" />
                <stop offset="0.7" stop-color="rgb(150, 155, 165)" stop-opacity="0" />
              </radialGradient>

              <filter id="fur-svg-filter" x="0" y="0" width="400" height="180"
                      filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
                <!-- 縁の毛先：縦横どちらにも細かく変わるノイズで形をずらす
                     （片方だけだと、左右の端がずれずに切れたように見える） -->
                <feTurbulence type="fractalNoise" baseFrequency="0.6 0.3" numOctaves="2" seed="3" result="edgeNoise" />
                <feDisplacementMap in="SourceGraphic" in2="edgeNoise" scale="8"
                                   xChannelSelector="R" yChannelSelector="G" result="displaced" />
                <!-- 毛先のギザギザをほんの少しぼかして、ふわっとさせる -->
                <feGaussianBlur in="displaced" stdDeviation="0.7" result="shaped" />

                <!-- 毛の流れ：縦に細かく変わるノイズ ＝ 横に流れる短い筋 -->
                <feTurbulence type="fractalNoise" baseFrequency="0.05 0.8" numOctaves="3" seed="8" result="strandNoise" />

                <!-- 筋を、うっすら明るい毛として重ねる -->
                <feColorMatrix in="strandNoise" type="matrix" result="strands"
                               values="0 0 0 0 0.75
                                       0 0 0 0 0.76
                                       0 0 0 0 0.8
                                       1.4 0 0 0 -0.7" />
                <feComposite in="strands" in2="shaped" operator="in" result="strandsIn" />
                <feComponentTransfer in="strandsIn" result="strandsSoft">
                  <feFuncA type="linear" slope="0.12" />
                </feComponentTransfer>

                <!-- 上からの光：筋のノイズを凹凸として使う。光源を上に置き、上ほど強く光らせる -->
                <feSpecularLighting in="strandNoise" surfaceScale="2" specularConstant="0.8"
                                    specularExponent="20" lighting-color="#9aa0ab" result="spec">
                  <fePointLight x="200" y="-40" z="70" />
                </feSpecularLighting>
                <feComposite in="spec" in2="shaped" operator="in" result="specIn" />
                <feComponentTransfer in="specIn" result="specSoft">
                  <feFuncA type="linear" slope="0.35" />
                </feComponentTransfer>

                <feMerge>
                  <feMergeNode in="shaped" />
                  <feMergeNode in="strandsSoft" />
                  <feMergeNode in="specSoft" />
                </feMerge>
              </filter>
            </defs>

            <!-- 地色とツヤを重ねた楕円に、まとめてフィルターをかける -->
            <g filter="url(#fur-svg-filter)">
              <ellipse cx="200" cy="90" rx="180" ry="70" fill="url(#fur-svg-fill)" />
              <ellipse cx="200" cy="90" rx="180" ry="70" fill="url(#fur-svg-sheen)" />
            </g>
          </svg>
        </div>
      </section>

      <section>
        <h2>3. 組み合わせ</h2>
        <p>CSS で地色・ツヤ・影を描き、SVG フィルターで毛先の縁と毛の筋を加える。</p>
        <div class="specimen fur-mix" role="img" aria-label="CSS と SVG フィルターを組み合わせて描いた黒い毛の楕円"></div>
      </section>
    </main>

    <!-- 方法3で HTML 要素にかけるフィルター（単位は CSS の px） -->
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute">
      <filter id="fur-mix-filter" x="-5%" y="-10%" width="110%" height="120%"
              color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.6 0.3" numOctaves="2" seed="3" result="edgeNoise" />
        <feDisplacementMap in="SourceGraphic" in2="edgeNoise" scale="8"
                           xChannelSelector="R" yChannelSelector="G" result="shaped" />

        <feTurbulence type="fractalNoise" baseFrequency="0.05 0.8" numOctaves="3" seed="8" result="strandNoise" />
        <feColorMatrix in="strandNoise" type="matrix" result="strands"
                       values="0 0 0 0 0.75
                               0 0 0 0 0.76
                               0 0 0 0 0.8
                               1.4 0 0 0 -0.7" />
        <feComposite in="strands" in2="shaped" operator="in" result="strandsIn" />
        <feComponentTransfer in="strandsIn" result="strandsSoft">
          <feFuncA type="linear" slope="0.2" />
        </feComponentTransfer>

        <feMerge>
          <feMergeNode in="shaped" />
          <feMergeNode in="strandsSoft" />
        </feMerge>
      </filter>
    </svg>

    <script type="module">
      // 伸び縮みの再生・停止。prefers-reduced-motion のときは止めた状態から始める。
      const root = document.documentElement;
      const button = document.querySelector('.motion-toggle');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      function setMotion(isOn) {
        root.dataset.motion = isOn ? 'on' : 'off';
        button.setAttribute('aria-pressed', String(!isOn));
        button.textContent = isOn ? '動きを止める' : '動かす';
      }

      setMotion(!reduceMotion.matches);
      button.addEventListener('click', () => setMotion(root.dataset.motion !== 'on'));
    </script>
  </body>
</html>
