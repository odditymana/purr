<?xml version="1.0" encoding="UTF-8"?>
<!--
  PURR：黒猫の形（シルエット） v3「横向きに寝る」
  - 部位ごとのパスだけを置く。色はここでは仮のもの（lab/cat.html では使わない）
  - 並び順は奥から手前の重なり順
  - g・transform・use・style・class は使わない
  - 頭は左。頬を床につけ、頭頂を左へ倒し、あごを胸の側（右）へ引いている
-->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <!-- しっぽ：腰の上から右上へゆるく立てる -->
  <path id="tail" fill="#333333"
        d="M572,108 C600,96 625,82 648,70 C658,64 668,62 672,66 C676,72 672,80 664,86 C645,100 622,116 600,130 Z" />

  <!-- 後ろ足：上の足と、その下に重なる下の足を右へ伸ばす -->
  <path id="hindLeg" fill="#333333"
        d="M560,125 C600,128 640,145 680,158 C705,163 730,160 745,166 C752,172 748,182 738,184 C710,186 680,182 650,182 C620,182 590,185 565,190 Z
           M580,195 C620,190 660,190 700,193 C730,196 760,200 765,212 C766,224 755,232 740,230 C710,228 680,226 650,222 C620,220 595,225 570,235 Z" />

  <!-- 胴体：背中の線に肩と腰の2つの山。下の縁は床 -->
  <path id="body" fill="#333333"
        d="M190,165 C220,150 250,140 275,132 C300,112 330,96 370,90 C420,86 480,92 530,96 C560,100 585,108 600,125 C612,140 605,165 590,180 C585,215 575,240 560,255 C540,275 525,300 510,330 C480,340 400,342 300,342 C250,342 200,342 190,330 Z" />

  <!-- お腹：のどから胸、お腹にかけての手前の面。撫でる位置として使う -->
  <path id="belly" fill="#555555"
        d="M240,205 C265,180 310,170 350,178 C400,188 470,196 540,200 C570,204 588,222 580,242 C570,260 530,268 480,262 C440,258 410,264 390,282 C368,302 338,318 300,322 C268,324 245,300 240,270 Z" />

  <!-- 耳：頭頂が左なので、上の耳は左上へ、床側の耳は左へ倒れる -->
  <path id="earFar" fill="#333333"
        d="M118,205 C108,185 92,160 76,140 C74,137 77,135 80,137 C105,148 130,158 158,166 Z" />

  <path id="earNear" fill="#333333"
        d="M95,282 C80,295 60,308 40,316 C36,318 37,322 41,323 C65,330 90,334 112,338 Z" />

  <!-- 頭：頭頂が左、鼻先が右下、頬は床につく -->
  <path id="head" fill="#333333"
        d="M140,168 C150,160 160,157 175,158 C210,160 245,180 262,205 C276,228 278,260 270,285 C262,305 248,322 230,334 C210,344 160,346 125,342 C105,338 92,322 90,300 C88,275 92,245 102,222 C110,200 125,180 140,168 Z" />

  <!-- 前足：胸の前で丸めた2本（奥・手前）を1つのパスにまとめる -->
  <path id="frontLegs" fill="#333333"
        d="M360,180 C390,180 420,195 445,220 C462,236 478,250 480,270 C482,288 470,300 455,298 C440,296 430,285 420,275 C400,260 380,250 360,240 Z
           M380,262 C410,270 440,280 470,282 C500,280 525,285 538,298 C545,310 538,325 520,328 C495,332 465,335 440,335 C415,334 395,320 380,300 Z" />

  <!-- 顔のパーツ：閉じた目は上下に2つ（1つのパスにまとめる） -->
  <path id="eye" fill="#000000"
        d="M192,226 C198,228 204,232 208,238 C203,235 197,231 192,226 Z
           M175,282 C185,286 195,288 205,286 C195,286 185,285 175,282 Z" />

  <path id="nose" fill="#000000"
        d="M232,258 C238,256 244,258 246,262 C247,268 244,274 240,276 C236,274 233,268 232,262 Z" />

  <path id="mouth" fill="none" stroke="#888888" stroke-width="1.5"
        d="M240,276 C240,282 238,288 234,292 M240,282 C246,288 252,292 258,292" />

  <!-- ひげ：1本ずつのサブパスを1つのパスにまとめる（最後の2本は眉のひげ） -->
  <path id="whiskers" fill="none" stroke="#888888" stroke-width="1"
        d="M250,262 C272,252 296,246 322,244
           M252,268 C276,264 302,264 328,268
           M252,274 C274,278 296,288 318,302
           M248,280 C264,292 278,306 290,324
           M208,224 C214,210 222,198 234,186
           M214,228 C224,218 236,210 250,204" />
</svg>
