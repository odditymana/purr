<?xml version="1.0" encoding="UTF-8"?>
<!--
  PURR：黒猫の形（シルエット） v2「ごろんと甘える」
  - 部位ごとのパスだけを置く。色はここでは仮のもの（lab/cat.html では使わない）
  - 並び順は奥から手前の重なり順
  - g・transform・use・style・class は使わない
  - 頭は横顔を上下に返した向き：あご・のどが上（胸の側）、頭頂と耳が下（床の側）
-->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <!-- しっぽ：腰の下から右へ出て、後ろ足のうしろでゆるく上へ流す -->
  <path id="tail" fill="#333333"
        d="M585,298 C630,300 670,290 700,262 C716,246 728,232 742,230 C750,229 752,236 746,240 C734,248 724,262 712,276 C684,306 640,318 590,318 Z" />

  <!-- 後ろ足：手前の足（ももから右へ伸ばす）と、その下からのぞく奥の足 -->
  <path id="hindLeg" fill="#333333"
        d="M528,240 C545,215 579,210 597,228 C613,244 620,262 631,270 C651,282 672,286 691,290 C699,292 701,302 693,305 C669,310 642,308 621,302 C596,296 570,292 549,285 C532,278 523,260 528,240 Z
           M570,300 C604,306 638,314 672,322 C681,325 681,333 672,334 C638,334 604,330 574,324 Z" />

  <!-- 胴体：上の縁は胸（肩）→ 胴のくびれ → 腰の3つの山。下の縁は床に接する背中 -->
  <path id="body" fill="#333333"
        d="M175,220 C205,190 239,160 281,152 C324,145 362,165 392,185 C422,200 451,190 485,178 C528,165 570,175 592,205 C613,235 613,280 596,305 C579,328 536,338 485,336 C434,334 400,325 366,328 C324,332 281,340 239,336 C218,334 200,325 192,310 C184,290 175,250 175,220 Z" />

  <!-- お腹：胴体の上側（胸からお腹）に見える面。撫でる位置として使う -->
  <path id="belly" fill="#555555"
        d="M226,185 C256,165 290,158 320,163 C354,170 375,188 400,198 C434,208 468,195 502,192 C532,190 553,200 562,215 C536,232 485,240 434,238 C383,236 349,226 315,222 C281,218 247,212 226,200 Z" />

  <!-- 耳：頭が逆さまに近いので、床の側（左下）へ倒れる -->
  <path id="earFar" fill="#333333"
        d="M130,322 C130,336 128,348 124,358 C123,362 126,364 130,362 C144,352 156,342 170,330 Z" />

  <path id="earNear" fill="#333333"
        d="M88,300 C82,314 74,328 64,340 C61,344 63,348 68,347 C88,342 112,336 134,328 Z" />

  <!-- 頭：鼻先が左、あごが上、頭頂が下 -->
  <path id="head" fill="#333333"
        d="M64,232 C70,222 82,212 96,206 C112,200 132,198 150,200 C168,203 182,212 192,226 C204,246 208,280 200,302 C192,322 168,334 140,334 C112,334 92,320 82,302 C76,290 74,278 72,270 C70,262 66,254 64,246 C62,240 62,236 64,232 Z" />

  <!-- 前足：胸の前で手首を軽く曲げて丸めた2本（奥・手前）を1つのパスにまとめる -->
  <path id="frontLegs" fill="#333333"
        d="M236,212 C228,194 222,180 220,168 C210,172 196,172 192,164 C188,156 196,146 210,146 C228,146 246,150 256,160 C258,180 260,196 262,208 Z
           M262,206 C254,186 250,170 250,156 C240,160 226,160 220,152 C214,144 222,134 236,134 C252,134 266,142 272,154 C278,170 284,188 292,204 Z" />

  <!-- 顔のパーツ（頭の向きに合わせて上下を返している） -->
  <path id="eye" fill="#000000"
        d="M88,276 C95,269 106,268 116,276 C106,272 96,272 88,276 Z" />

  <path id="nose" fill="#000000"
        d="M60,236 C60,232 63,230 67,231 C70,232 71,236 70,240 C69,244 65,245 62,243 C60,241 60,239 60,236 Z" />

  <path id="mouth" fill="none" stroke="#888888" stroke-width="1.5"
        d="M68,229 C70,224 73,220 77,217 C84,212 91,209 99,207" />

  <!-- ひげ：1本ずつのサブパスを1つのパスにまとめる（最後の2本は眉のひげ） -->
  <path id="whiskers" fill="none" stroke="#888888" stroke-width="1"
        d="M84,224 C62,214 40,200 16,192
           M86,229 C62,224 38,220 12,222
           M88,234 C64,236 40,242 18,256
           M90,238 C70,246 52,258 36,276
           M98,290 C88,306 78,318 62,330
           M104,292 C98,310 92,324 80,338" />
</svg>
