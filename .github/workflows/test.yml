# 計算のテスト（test/）を、main への push と pull request のたびに走らせる。
# GitHub Pages の公開（ブランチから公開）とは別に動くので、公開には影響しない。
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
