<?xml version="1.0" encoding="UTF-8"?>
<!--
  PURR：黒猫の形（シルエット） v3「横向きに寝る」
  - 部位ごとのパスだけを置く。色はここでは仮のもの
  - 並び順は奥から手前の重なり順
  - g・transform・use・style・class は使わない
  - 頭は左。頬を床につけ、頭頂を左へ倒し、あごを胸の側（右）へ引いている
-->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <!-- 後ろ足：体の下にたたんで、外からは見えない。読み込みの必須 id なので、
       腰の内側に完全に収まる小さな形として残す（毛のフィルターでにじみ出ないよう、輪郭から十分内側に置く） -->
  <path id="hindLeg" fill="#333333"
        d="M582,290 C582,282 592,278 600,278 C610,278 618,282 618,290 C618,298 610,302 600,302 C590,302 582,298 582,290 Z" />

  <!-- 胴体：背中の線に肩と腰の2つの山。腰は丸いかたまりのまま、なめらかに床へ下りる。下の縁は床 -->
  <path id="body" fill="#333333"
        d="M190,165 C220,150 250,140 275,132 C300,112 330,96 370,90 C420,86 480,92 530,96 C565,99 600,110 625,135 C650,160 660,205 652,245 C646,276 646,318 620,334 C605,343 560,342 510,342 C460,342 400,342 300,342 C250,342 200,342 190,330 Z" />

  <!-- お腹：のどから胸、お腹にかけての手前の面。撫でる位置として使う -->
  <path id="belly" fill="#555555"
        d="M240,205 C265,180 310,170 350,178 C400,188 470,196 540,200 C570,204 588,222 580,242 C570,260 530,268 480,262 C440,258 410,264 390,282 C368,302 338,318 300,322 C268,324 245,300 240,270 Z" />

  <!-- しっぽ：体の手前に置く。丸い腰の後ろから出て、腰の輪郭に沿って床へ下り、
       体の下の縁に沿って前へ回す。先は力を抜いて丸く終える -->
  <path id="tail" fill="#333333"
        d="M646,230 C658,236 666,252 664,272 C661,295 650,322 625,336 C605,343 575,342 550,342 C520,342 490,342 466,341 C452,341 442,338 440,332 C438,326 446,324 456,325 C490,327 520,328 552,328 C578,328 598,322 614,310 C632,296 642,278 644,258 C645,246 642,238 636,232 C638,228 643,228 646,230 Z" />

  <!-- 耳：頭頂が左なので、上の耳は左上へ、床側の耳は頭に沿って寝る -->
  <path id="earFar" fill="#333333"
        d="M118,205 C108,185 92,160 76,140 C74,137 77,135 80,137 C105,148 130,158 158,166 Z" />

  <path id="earNear" fill="#333333"
        d="M96,290 C90,304 82,318 72,330 C70,333 72,336 76,336 C88,337 100,338 112,338 Z" />

  <!-- 頭：頭頂が左、鼻先が右下、頬は床につく -->
  <path id="head" fill="#333333"
        d="M140,168 C150,160 160,157 175,158 C210,160 245,180 262,205 C276,228 278,260 270,285 C262,305 248,322 230,334 C210,344 160,346 125,342 C105,338 92,322 90,300 C88,275 92,245 102,222 C110,200 125,180 140,168 Z" />

  <!-- 前足：胸の前で丸めた2本（奥・手前）を1つのパスにまとめる。
       手首は小さく丸めて、柔らかいかたまりにする -->
  <path id="frontLegs" fill="#333333"
        d="M372,214 C400,212 430,222 452,238 C468,250 474,266 466,278 C458,288 442,288 430,280 C414,268 394,258 374,252 C366,240 366,224 372,214 Z
           M392,282 C420,286 452,292 478,296 C498,298 512,308 510,320 C508,332 494,336 478,334 C450,332 420,330 396,326 C386,314 386,292 392,282 Z" />

  <!-- 顔のパーツ：閉じた目は上下に2つ（1つのパスにまとめる） -->
  <path id="eye" fill="#000000"
        d="M188,222 C196,225 205,232 211,241 C204,235 196,229 188,222 Z
           M171,281 C183,286 196,289 209,286 C196,286 183,285 171,281 Z" />

  <!-- 鼻：頭頂が左なので、先は右（口の側）を向く。左（額の側）が丸く、右へすぼまって、
       先が口の溝の起点（247,267）につながる横向きのしずく形。参考写真の鼻の形に合わせる -->
  <path id="nose" fill="#000000"
        d="M247.5,267.5 C244,264 239.5,259.5 236,256 C233.5,254 230.5,256 230.5,259.5
           C230.5,263 232.5,265 236,265.6 C240,266.3 244,266.8 247.5,267.5 Z" />

  <!-- 口：頭頂が左なので、鼻の「下」は画面の右。鼻の右端から右へ短い溝を伸ばし、
       そこから上下に分かれて右へふくらむ弧を描く、横向きの「ω」。参考写真の口に合わせる -->
  <path id="mouth" fill="none" stroke="#888888" stroke-width="1.5"
        d="M247,267 C248.5,267.5 250,268 251,268.5 C255,266 256,261 252,257
           M251,268.5 C255,271 256,276.5 252,280.5" />

  <!-- ひげ：参考写真から取る。顔の左右が画面の上下に来るので、ひげは鼻をはさんだ
       上下のマズルから、上の束（4本）は上（やや右）へ、下の束（5本）は下（床）へ扇形に開く。
       上の束の根元は鼻の真上。下の束は、ほうきに見えないよう開きを狭めて根元を寄せる。
       根元はマズルの白い毛に隠れて写真では見えないため、ウィスカーパッドの位置から補う -->
  <path id="whiskers" fill="none" stroke="#888888" stroke-width="1"
        d="M234,228 C234,205 236,178 243,152
           M237,230 C238,212 243,186 256,165
           M241,228 C244,212 258,186 282,166
           M245,230 C251,206 269,178 293,162
           M221,290 C221,305 219,323 218,342
           M224,291 C224,305 225,320 227,337
           M227,291 C229,305 231,322 237,341
           M234,292 C238,306 247,324 258,338
           M237,291 C243,305 251,322 262,334" />
</svg>
