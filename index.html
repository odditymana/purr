<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PURR</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <!-- 和紙のムラと繊維（画面全体に固定） -->
    <svg class="paper" aria-hidden="true" focusable="false">
      <filter id="paper-texture" x="0" y="0" width="100%" height="100%">
        <!-- 大きなムラ -->
        <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="2" result="mottleNoise" />
        <feColorMatrix in="mottleNoise" type="matrix" result="mottle"
                       values="0 0 0 0 0.54
                               0 0 0 0 0.48
                               0 0 0 0 0.38
                               0.12 0 0 0 -0.03" />
        <!-- 細かい繊維 -->
        <feTurbulence type="fractalNoise" baseFrequency="0.04 0.6" numOctaves="2" seed="5" result="fiberNoise" />
        <feColorMatrix in="fiberNoise" type="matrix" result="fiber"
                       values="0 0 0 0 0.54
                               0 0 0 0 0.48
                               0 0 0 0 0.38
                               0.25 0 0 0 -0.1" />
        <feMerge>
          <feMergeNode in="mottle" />
          <feMergeNode in="fiber" />
        </feMerge>
      </filter>
      <rect width="100%" height="100%" filter="url(#paper-texture)" />
    </svg>

    <!-- 音を消すボタン（aria-pressed="true" のとき消音）。JS が使えるときだけ見せる -->
    <button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="false" aria-label="音を消す" title="音を消す" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path class="speaker" d="M4 9.5 H7.5 L12 5.5 V18.5 L7.5 14.5 H4 Z" />
        <path class="waves" d="M15 9 C16.3 10.4 16.3 13.6 15 15 M17.5 6.8 C20 9.3 20 14.7 17.5 17.2" />
        <path class="slash" d="M15.5 9.5 L20.5 14.5 M20.5 9.5 L15.5 14.5" />
      </svg>
    </button>

    <main>
      <h1>PURR</h1>

      <svg id="cat" viewBox="0 0 800 400" role="img" aria-label="横向きに丸くなって眠る黒猫">
        <defs>
          <!-- assets/cat-shape.svg から読み込んだ形がここに入る（id は shape-○○） -->
          <g id="shapes"></g>

          <!-- 地色：各部位の上から下へ、ごくわずかに暗く -->
          <linearGradient id="fur-base" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color: var(--fur-top)" />
            <stop offset="0.5" style="stop-color: var(--fur-mid)" />
            <stop offset="1" style="stop-color: var(--fur-bottom)" />
          </linearGradient>
          <!-- お腹：上ほどわずかに明るく -->
          <linearGradient id="belly-base" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color: var(--belly-top)" />
            <stop offset="1" style="stop-color: var(--belly-bottom)" />
          </linearGradient>

          <!-- ツヤと影：楕円にかけて使う。強さは楕円側の opacity で決める -->
          <radialGradient id="sheen">
            <stop offset="0" style="stop-color: var(--fur-sheen)" />
            <stop offset="1" style="stop-color: var(--fur-sheen); stop-opacity: 0" />
          </radialGradient>
          <radialGradient id="shade">
            <stop offset="0" style="stop-color: var(--fur-shade)" />
            <stop offset="1" style="stop-color: var(--fur-shade); stop-opacity: 0" />
          </radialGradient>

          <!-- ひげ：鼻の中心から外へ向かうほど透明に。
               中心（鼻）と半径（ひげのいちばん遠い先まで）は、読み込み後に JS が設定する。
               根元は半径の約 2.5〜3 割、短い下の束の先は約 5.5 割、長い上の束の先は 8〜9 割に来る。
               下の束も先が薄く見え、上の束は先へ向かって消えていくよう、途中に段を置く -->
          <radialGradient id="whisker-fade" gradientUnits="userSpaceOnUse" cx="400" cy="200" r="400">
            <stop offset="0.25" style="stop-color: var(--whisker); stop-opacity: 0.95" />
            <stop offset="0.55" style="stop-color: var(--whisker); stop-opacity: 0.35" />
            <stop offset="0.9" style="stop-color: var(--whisker); stop-opacity: 0.1" />
          </radialGradient>

          <!-- 毛：輪郭を少しぼかしてノイズでずらし、毛先のにじみと細い毛の筋を重ねる -->
          <filter id="fur" filterUnits="userSpaceOnUse" x="-40" y="-40" width="880" height="440"
                  color-interpolation-filters="sRGB">
            <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="soft" />
            <feTurbulence type="fractalNoise" baseFrequency="0.6 0.3" numOctaves="2" seed="3" result="edgeNoise" />
            <feDisplacementMap in="soft" in2="edgeNoise" scale="11"
                               xChannelSelector="R" yChannelSelector="G" result="shaped" />

            <!-- 毛先のまわりの、うっすらしたにじみ -->
            <feGaussianBlur in="shaped" stdDeviation="3.5" result="halo" />
            <feComponentTransfer in="halo" result="haloSoft">
              <feFuncA type="linear" slope="0.35" />
            </feComponentTransfer>

            <!-- 細い毛の筋 -->
            <feTurbulence type="fractalNoise" baseFrequency="0.05 0.8" numOctaves="3" seed="8" result="strandNoise" />
            <feColorMatrix in="strandNoise" type="matrix" result="strands"
                           values="0 0 0 0 0.75
                                   0 0 0 0 0.75
                                   0 0 0 0 0.73
                                   1.4 0 0 0 -0.7" />
            <feComposite in="strands" in2="shaped" operator="in" result="strandsIn" />
            <feComponentTransfer in="strandsIn" result="strandsSoft">
              <feFuncA type="linear" slope="0.14" />
            </feComponentTransfer>

            <feMerge>
              <feMergeNode in="haloSoft" />
              <feMergeNode in="shaped" />
              <feMergeNode in="strandsSoft" />
            </feMerge>
          </filter>

          <!-- 顔のパーツをなじませる軽いぼかし -->
          <filter id="soften" x="-30%" y="-80%" width="160%" height="260%">
            <feGaussianBlur stdDeviation="0.9" />
          </filter>

          <!-- ひげ：明るい背景の上でも見えるよう、ごく薄い影を付ける -->
          <filter id="whisker-shadow" filterUnits="userSpaceOnUse" x="-40" y="-40" width="880" height="440">
            <feDropShadow dx="0" dy="0.8" stdDeviation="0.7"
                          style="flood-color: var(--whisker-shadow)" flood-opacity="0.45" />
          </filter>
          <!-- 撫でた跡のツヤの筋：細い毛筋を軽くぼかして、柔らかい光にする -->
          <filter id="sheen-soften" filterUnits="userSpaceOnUse" x="-40" y="-40" width="880" height="440">
            <feGaussianBlur stdDeviation="1.2" />
          </filter>

          <!-- 撫でた跡のツヤの筋を、猫の形で切り抜く mask（体の層・頭の層） -->
          <mask id="sheen-mask-body" maskUnits="userSpaceOnUse" x="-40" y="-40" width="880" height="440">
            <use href="#shape-body" fill="#fff" />
            <use href="#shape-belly" fill="#fff" />
            <use href="#shape-tail" fill="#fff" />
            <use href="#shape-frontLegs" fill="#fff" />
          </mask>
          <mask id="sheen-mask-head" maskUnits="userSpaceOnUse" x="-40" y="-40" width="880" height="440">
            <use href="#shape-head" fill="#fff" />
            <use href="#shape-earNear" fill="#fff" />
          </mask>

          <!-- しっぽを根元と先に分ける mask。切れ目は x 560（先を回す支点のところ）。
               2つの切り口は少し重ねて、先が持ち上がっても継ぎ目にすき間が出ないようにする -->
          <mask id="tail-base-mask" maskUnits="userSpaceOnUse" x="-40" y="-40" width="880" height="440">
            <rect x="558" y="-40" width="282" height="440" fill="#fff" />
          </mask>
          <mask id="tail-tip-mask" maskUnits="userSpaceOnUse" x="-40" y="-40" width="880" height="440">
            <rect x="-40" y="-40" width="602" height="440" fill="#fff" />
          </mask>

          <!-- 撫でた場所が沈む：撫でている点のまわりの絵を、少しだけ下へずらす。
               ずらす量の地図は、中間の灰色（ずらさない）の上に、中心ほど緑が弱い放射グラデーションの画像を置いたもの。
               緑が 0.5 より小さいほど、上の絵を持ってくる（= 絵が下へ沈む）。
               地図の位置（feImage の x・y・width・height）と深さ（scale）は、撫でている間 JS が動かす。
               撫でていないときは、このフィルターは外してある -->
          <filter id="press" filterUnits="userSpaceOnUse" x="-40" y="-40" width="880" height="440"
                  color-interpolation-filters="sRGB">
            <feFlood flood-color="rgb(128,128,128)" result="neutral" />
            <feImage id="press-map" preserveAspectRatio="none" x="0" y="0" width="80" height="80" result="dent"
                     href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='100'%20height='100'%3E%3CradialGradient%20id='g'%3E%3Cstop%20offset='0'%20stop-color='rgb(128,0,128)'/%3E%3Cstop%20offset='0.45'%20stop-color='rgb(128,50,128)'/%3E%3Cstop%20offset='0.75'%20stop-color='rgb(128,108,128)'/%3E%3Cstop%20offset='1'%20stop-color='rgb(128,128,128)'/%3E%3C/radialGradient%3E%3Crect%20width='100'%20height='100'%20fill='url(%23g)'/%3E%3C/svg%3E" />
            <feMerge result="map">
              <feMergeNode in="neutral" />
              <feMergeNode in="dent" />
            </feMerge>
            <feDisplacementMap id="press-displacement" in="SourceGraphic" in2="map" scale="0"
                               xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </defs>

        <!-- ===== 猫全体：撫でた場所が沈むフィルター（#press）は、撫でている間だけ JS がここに付ける ===== -->
        <g id="cat-press">
          <!-- ===== 体：呼吸で膨らむ =====
               毛のフィルターは、呼吸で動かすこのグループの中で、部位をまとめた入れ物にかける。
               動かすのは外側のグループなので、毛のノイズも一緒に動き、チラつかない。
               （フィルターの中の部位だけを動かすと、輪郭が固定されたノイズの上をすべってチラつく）
               並びは奥から手前。各部位のツヤと影は、読み込み後に JS が data-part の中へ足す -->
          <g id="cat-body" class="breath-body">
            <g filter="url(#fur)">
              <g data-part="hindLeg"><use href="#shape-hindLeg" class="fur" /></g>
              <g data-part="body"><use href="#shape-body" class="fur" /></g>
              <g data-part="belly"><use href="#shape-belly" class="fur belly" /></g>
              <!-- しっぽ（根元）：体の手前。上の縁に細いツヤを出すため、同じ形を左上へずらして奥に置く。
                   先の部分は mask で隠し、下の #tail-tip で描く -->
              <g mask="url(#tail-base-mask)">
                <g id="tail-art" data-part="tail">
                  <use href="#shape-tail" class="tail-rim" transform="translate(-1.5 -1.5)" />
                  <use href="#shape-tail" class="fur" />
                </g>
              </g>
            </g>
            <!-- しっぽ（先）：撫でているあいだ、ときどきぱたっと持ち上がる。
                 根元と同じしっぽ（ツヤと影も含む）を写し、先の部分だけを残す。
                 毛のフィルターは、回すこのグループそのものにかける（耳と同じく、チラつかないようにする） -->
            <g id="tail-tip" class="tail-flick" data-part="tail" filter="url(#fur)">
              <g mask="url(#tail-tip-mask)">
                <!-- 持ち上がる一瞬だけ明るくなる、上の縁のツヤ（ふだんは見えない。JS が不透明度を動かす） -->
                <use id="tail-flash" href="#shape-tail" class="tail-flash" transform="translate(-2 -2)" />
                <use href="#tail-art" />
              </g>
            </g>
            <!-- 前足：しっぽの先より手前。しっぽの先を間にはさむため、毛のフィルターは別にかける -->
            <g filter="url(#fur)">
              <g data-part="frontLegs"><use href="#shape-frontLegs" class="fur" /></g>
            </g>
            <!-- 撫でた跡のツヤの筋（体）。毛のフィルターの外に置き、軽くぼかしてから猫の形で切り抜く -->
            <g id="sheen-body" class="sheen-trails" filter="url(#sheen-soften)" mask="url(#sheen-mask-body)"></g>
          </g>

          <!-- ===== 頭：体の呼吸に少しだけつられて動く。顔のパーツとひげも一緒に動かす ===== -->
          <g id="cat-head" class="breath-head">
            <!-- 上の耳：ときどきぴくっと動く。毛のフィルターは、回すこのグループそのものにかける
                 （頭のグループの中で耳だけを回すと、耳の縁の毛先がチラつく） -->
            <g id="ear-twitch" class="ear-twitch" filter="url(#fur)">
              <g data-part="earFar"><use href="#shape-earFar" class="fur" /></g>
            </g>
            <g filter="url(#fur)">
              <g data-part="earNear"><use href="#shape-earNear" class="fur" /></g>
              <g data-part="head"><use href="#shape-head" class="fur" /></g>
            </g>
            <!-- 撫でた跡のツヤの筋（頭） -->
            <g id="sheen-head" class="sheen-trails" filter="url(#sheen-soften)" mask="url(#sheen-mask-head)"></g>

            <!-- 顔のパーツ（毛のフィルターはかけない） -->
            <g id="cat-face" filter="url(#soften)">
              <!-- 目の縁のツヤ：同じ形を右下へずらして奥に置く -->
              <use href="#shape-eye" class="eye-rim" transform="translate(1 1.5)" />
              <use href="#shape-eye" class="eye" />
              <use id="nose-use" href="#shape-nose" class="nose" />
              <use href="#shape-mouth" class="mouth" />
            </g>

            <!-- ひげ -->
            <g filter="url(#whisker-shadow)">
              <use id="whiskers-use" href="#shape-whiskers" class="whiskers" />
            </g>
          </g>
        </g>
      </svg>
    </main>
  </body>
</html>
